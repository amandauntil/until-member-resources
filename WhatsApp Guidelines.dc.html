  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

93, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   UNTIL — Colors & Type Tokens\n   ============================================================\n   Source of truth for the brand palette and typography scale.\n   Derived from until.co.uk (live site) + supplied logo files\n   + brand-issued font files (Tungsten + DIN 2014).\n   ============================================================ */\n\n/* ---------- Brand fonts ----------\n   Tungsten (Hoefler) — condensed display sans, used for all\n   headlines, eyebrows set LARGE, and hero wordmarks. Three\n   weights supplied: Light, Semibold, Bold.\n\n   DIN 2014 — humanist geometric sans used for all body, UI,\n   and button labels. One weight supplied: Bold; we map it to\n   600+ and use the system sans stack for lighter weights\n   until further weights are supplied.\n   --------------------------------------------------------- */\n\n@font-face {\n  font-family: 'Tungsten';\n  src: url(\"df03c481-1f73-40f9-a165-eb5ee51936cd\") format('opentype');\n  font-weight: 300;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: 'Tungsten';\n  src: url(\"5b4c8ab9-0719-4e12-a266-e64b3a2af35a\") format('opentype');\n  font-weight: 600;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: 'Tungsten';\n  src: url(\"1b568d9d-64a7-4bc9-b110-d26432b2636e\") format('opentype');\n  font-weight: 700;\n  font-style: normal;\n  font-display: swap;\n}\n/* Map Tungsten Bold up to 800/900 so clamp-based sizing still renders */\n@font-face {\n  font-family: 'Tungsten';\n  src: url(\"1b568d9d-64a7-4bc9-b110-d26432b2636e\") format('opentype');\n  font-weight: 800 900;\n  font-style: normal;\n  font-display: swap;\n}\n\n@font-face {\n  font-family: 'DIN 2014';\n  src: url(\"ed543dd7-f930-4412-aeb7-eee00c07c0f4\") format('opentype');\n  font-weight: 600 800;\n  font-style: normal;\n  font-display: swap;\n}\n\n:root {\n  /* ============================================================\n     COLOR — Brand\n     ============================================================ */\n\n  /* Primary — Navy (lifted directly from the logo path fill) */\n  --until-navy:        #020417;   /* Primary brand navy / logo */\n  --until-navy-900:    #050925;\n  --until-navy-800:    #0a1138;\n  --until-navy-700:    #131c4d;\n  --until-navy-600:    #1f2a66;\n  --until-navy-500:    #2f3d80;   /* hover / active accents */\n\n  /* Neutrals — warm off-whites that read \"premium clinic\" */\n  --until-bone:        #f5f1ea;   /* primary cream surface     */\n  --until-cream:       #ede6d8;   /* warmer cream / cards      */\n  --until-stone:       #d9d2c2;   /* muted earth divider       */\n  --until-mist:        #e9ebef;   /* cool grey surface         */\n  --until-paper:       #ffffff;\n\n  /* Earth + accent (sampled from the brand's editorial photography) */\n  --until-clay:        #c9a98a;   /* warm tan accent           */\n  --until-moss:        #5a6b4a;   /* sage / wellness accent    */\n  --until-rust:        #b8623a;   /* rare CTA / highlight      */\n  --until-gold:        #b89968;\n\n  /* Functional / semantic */\n  --until-success:     #3f7f5a;\n  --until-warning:     #c89436;\n  --until-error:       #b53e3e;\n  --until-info:        var(--until-navy-600);\n\n  /* ============================================================\n     COLOR — Semantic (use these in components)\n     ============================================================ */\n\n  /* Foreground */\n  --fg-1:              var(--until-navy);          /* primary text */\n  --fg-2:              #2a2f4a;                    /* secondary    */\n  --fg-3:              #5b607a;                    /* muted/meta   */\n  --fg-4:              #8a8fa3;                    /* placeholder  */\n  --fg-on-navy:        var(--until-bone);\n  --fg-on-navy-muted:  rgba(245, 241, 234, 0.65);\n\n  /* Background */\n  --bg-page:           var(--until-bone);\n  --bg-surface:        var(--until-paper);\n  --bg-surface-warm:   var(--until-cream);\n  --bg-inverse:        var(--until-navy);\n  --bg-tint:           rgba(2, 4, 23, 0.04);\n\n  /* Border / dividers */\n  --border-1:          rgba(2, 4, 23, 0.10);\n  --border-2:          rgba(2, 4, 23, 0.18);\n  --border-strong:     var(--until-navy);\n  --border-on-navy:    rgba(245, 241, 234, 0.18);\n\n  /* Brand accent (for badges, links, focus) */\n  --accent-primary:    var(--until-navy);\n  --accent-warm:       var(--until-clay);\n  --accent-cool:       var(--until-moss);\n\n  /* ============================================================\n     TYPOGRAPHY — Families\n     Tungsten (condensed display) + DIN 2014 (humanist body).\n     DIN only ships Bold, so the body stack falls back to\n     system sans for light/regular weights.\n     ============================================================ */\n  --font-display: 'Tungsten', 'Oswald', 'Helvetica Neue Condensed', 'Arial Narrow', sans-serif;\n  --font-sans:    'DIN 2014', 'DIN Next', 'Helvetica Neue', -apple-system, BlinkMacSystemFont, Arial, sans-serif;\n  --font-body:    -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Helvetica', Arial, sans-serif;\n  --font-mono:    'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;\n\n  /* ============================================================\n     TYPOGRAPHY — Weights\n     ============================================================ */\n  --fw-light:    300;\n  --fw-regular:  400;\n  --fw-medium:   500;\n  --fw-semibold: 600;\n  --fw-bold:     700;\n  --fw-black:    900;\n\n  /* ============================================================\n     TYPOGRAPHY — Scale (px-equivalent in rem, base 16)\n     ============================================================ */\n  --fs-xs:    0.75rem;    /* 12  micro / eyebrow      */\n  --fs-sm:    0.875rem;   /* 14  caption / meta       */\n  --fs-base:  1rem;       /* 16  body                 */\n  --fs-md:    1.125rem;   /* 18  lead body            */\n  --fs-lg:    1.375rem;   /* 22  large body / sub     */\n  --fs-xl:    1.75rem;    /* 28  h4                   */\n  --fs-2xl:   2.25rem;    /* 36  h3                   */\n  --fs-3xl:   3rem;       /* 48  h2                   */\n  --fs-4xl:   4rem;       /* 64  h1                   */\n  --fs-5xl:   5.5rem;     /* 88  display              */\n  --fs-6xl:   7.5rem;     /* 120 hero (uppercase)     */\n\n  /* Line heights */\n  --lh-tight:   1.02;\n  --lh-snug:    1.12;\n  --lh-normal:  1.4;\n  --lh-relaxed: 1.55;\n  --lh-loose:   1.7;\n\n  /* Letter spacing — Tungsten is condensed and tight by nature;\n     headlines get 0 tracking, eyebrows stay loose. DIN body is\n     neutral. */\n  --ls-display: 0em;\n  --ls-headline: 0em;\n  --ls-body:    0em;\n  --ls-eyebrow: 0.18em;\n  --ls-button:  0.08em;\n\n  /* ============================================================\n     SPACING — 4-pt scale\n     ============================================================ */\n  --sp-1: 4px;\n  --sp-2: 8px;\n  --sp-3: 12px;\n  --sp-4: 16px;\n  --sp-5: 20px;\n  --sp-6: 24px;\n  --sp-8: 32px;\n  --sp-10: 40px;\n  --sp-12: 48px;\n  --sp-16: 64px;\n  --sp-20: 80px;\n  --sp-24: 96px;\n  --sp-32: 128px;\n\n  /* ============================================================\n     RADII — modest. UNTIL is mostly square / soft-rect.\n     ============================================================ */\n  --r-none: 0;\n  --r-xs:   4px;\n  --r-sm:   6px;\n  --r-md:   10px;\n  --r-lg:   16px;\n  --r-xl:   24px;\n  --r-pill: 999px;\n\n  /* ============================================================\n     SHADOWS — soft, low-contrast, premium clinic feel.\n     ============================================================ */\n  --shadow-xs: 0 1px 2px rgba(2,4,23,0.04);\n  --shadow-sm: 0 2px 6px rgba(2,4,23,0.06), 0 1px 2px rgba(2,4,23,0.04);\n  --shadow-md: 0 8px 20px rgba(2,4,23,0.08), 0 2px 6px rgba(2,4,23,0.05);\n  --shadow-lg: 0 18px 40px rgba(2,4,23,0.10), 0 4px 10px rgba(2,4,23,0.05);\n  --shadow-xl: 0 32px 80px rgba(2,4,23,0.16);\n\n  /* ============================================================\n     MOTION\n     ============================================================ */\n  --ease-standard: cubic-bezier(0.2, 0, 0.1, 1);\n  --ease-emphasized: cubic-bezier(0.25, 0.1, 0, 1);\n  --dur-fast: 140ms;\n  --dur-base: 240ms;\n  --dur-slow: 480ms;\n}\n\n/* ============================================================\n   SEMANTIC TYPE STYLES\n   Use these classes (or the matching element) directly.\n   ============================================================ */\n.t-eyebrow,\n.eyebrow {\n  font-family: var(--font-body);\n  font-size: var(--fs-xs);\n  font-weight: var(--fw-semibold);\n  letter-spacing: var(--ls-eyebrow);\n  text-transform: uppercase;\n  color: var(--fg-3);\n}\n\n.t-display,\nh1.display {\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: clamp(5rem, 10vw, var(--fs-6xl));\n  line-height: 0.92;\n  letter-spacing: var(--ls-display);\n  text-transform: uppercase;\n  color: var(--fg-1);\n}\n\n.t-h1, h1 {\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: clamp(3rem, 6vw, var(--fs-4xl));\n  line-height: 0.95;\n  letter-spacing: var(--ls-headline);\n  text-transform: uppercase;\n  color: var(--fg-1);\n}\n\n.t-h2, h2 {\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: var(--fs-3xl);\n  line-height: 0.98;\n  letter-spacing: var(--ls-headline);\n  text-transform: uppercase;\n  color: var(--fg-1);\n}\n\n.t-h3, h3 {\n  font-family: var(--font-display);\n  font-weight: 600;\n  font-size: var(--fs-2xl);\n  line-height: 1.02;\n  letter-spacing: var(--ls-headline);\n  text-transform: uppercase;\n  color: var(--fg-1);\n}\n\n.t-h4, h4 {\n  font-family: var(--font-display);\n  font-weight: 600;\n  font-size: var(--fs-xl);\n  line-height: 1.05;\n  text-transform: uppercase;\n  color: var(--fg-1);\n}\n\n.t-lead {\n  font-family: var(--font-body);\n  font-size: var(--fs-md);\n  font-weight: 400;\n  line-height: var(--lh-relaxed);\n  color: var(--fg-2);\n}\n\n.t-body, p {\n  font-family: var(--font-body);\n  font-size: var(--fs-base);\n  font-weight: 400;\n  line-height: var(--lh-relaxed);\n  color: var(--fg-2);\n}\n\n.t-meta, small {\n  font-family: var(--font-body);\n  font-size: var(--fs-sm);\n  font-weight: 400;\n  line-height: var(--lh-normal);\n  color: var(--fg-3);\n}\n\n.t-button {\n  font-family: var(--font-sans);\n  font-size: var(--fs-sm);\n  font-weight: 700;\n  letter-spacing: var(--ls-button);\n  text-transform: uppercase;\n}\n\ncode, .t-mono {\n  font-family: var(--font-mono);\n  font-size: 0.95em;\n}\n<\u002Fstyle>\n  <script src=\"b58801d8-6f0e-4065-86d5-f95e6e5c5b85\"><\u002Fscript>\n  <style>\n    @font-face{font-family:'Tungsten';src:url(\"5b4c8ab9-0719-4e12-a266-e64b3a2af35a\") format('opentype');font-weight:600;font-style:normal;font-display:swap}\n    @font-face{font-family:'DIN 2014';src:url(\"ed543dd7-f930-4412-aeb7-eee00c07c0f4\") format('opentype');font-weight:700;font-style:normal;font-display:swap}\n    *{box-sizing:border-box}\n    html,body{margin:0;padding:0}\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"background:#FCFCFD;min-height:100vh;font-family:'DIN 2014',sans-serif;color:#01030E;-webkit-font-smoothing:antialiased\" data-screen-label=\"WhatsApp Guidelines\">\n\n  <!-- HERO -->\n  <section style=\"background:#04082A;padding:56px 32px 48px;position:relative;overflow:hidden\">\n    <div style=\"max-width:840px;margin:0 auto;position:relative\">\n      <a href=\"/index.html\" style=\"display:inline-flex;align-items:center;gap:8px;font-family:'DIN 2014',sans-serif;font-weight:700;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:rgba(252,252,253,0.55);text-decoration:none;margin-bottom:22px\" style-hover=\"color:#FCFCFD\">\n        <svg viewBox=\"0 0 24 24\" width=\"13\" height=\"13\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 12H5M11 18l-6-6 6-6\"><\u002Fpath><\u002Fsvg>\n        Back to dashboard\n      <\u002Fa>\n      <div style=\"font-family:'DIN 2014',sans-serif;font-weight:700;font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:#B9BEF1;margin-bottom:16px\">WhatsApp Community<\u002Fdiv>\n      <h1 style=\"font-family:'Tungsten',sans-serif;font-weight:600;font-size:clamp(2.4rem,5.5vw,4rem);text-transform:uppercase;line-height:0.96;letter-spacing:0;color:#FCFCFD;margin:0 0 18px\">Community Guidelines.<\u002Fh1>\n      <p style=\"font-family:'DIN 2014',sans-serif;font-weight:700;font-size:15px;color:rgba(252,252,253,0.6);line-height:1.6;max-width:560px;margin:0\">This space is for professionals across wellness sectors to connect, share and collaborate. Please read and follow these rules to keep it useful for everyone.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CONTENT -->\n  <div style=\"max-width:840px;margin:0 auto;padding:48px 32px 64px\">\n    <sc-for list=\"{{ sections }}\" as=\"sec\" hint-placeholder-count=\"10\">\n      <div style=\"margin-bottom:28px;padding-bottom:28px;border-bottom:1px solid rgba(1,3,14,0.1)\">\n        <div style=\"display:flex;align-items:baseline;gap:12px;margin-bottom:10px\">\n          <span style=\"font-family:'Tungsten',sans-serif;font-weight:600;font-size:22px;color:#B9BEF1;line-height:1\">{{ sec.num }}<\u002Fspan>\n          <h3 style=\"font-family:'DIN 2014',sans-serif;font-weight:700;font-size:15px;letter-spacing:0.02em;text-transform:uppercase;color:#01030E;margin:0\">{{ sec.title }}<\u002Fh3>\n        <\u002Fdiv>\n        <sc-for list=\"{{ sec.points }}\" as=\"pt\" hint-placeholder-count=\"2\">\n          <div style=\"display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;padding-left:34px\">\n            <span style=\"width:4px;height:4px;border-radius:50%;background:rgba(1,3,14,0.3);flex-shrink:0;margin-top:9px\"><\u002Fspan>\n            <p style=\"font-size:14.5px;color:rgba(1,3,14,0.68);line-height:1.65;margin:0\">{{ pt }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n\n    <div style=\"background:#F2F4F7;border-radius:10px;padding:20px 22px;margin-top:8px\">\n      <p style=\"font-size:13px;color:rgba(1,3,14,0.55);line-height:1.6;margin:0\">Breaching these guidelines, including misuse of another member's contact details obtained through the community, may result in removal from the group and a review of your UNTIL membership.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst SECTIONS = [\n  { num: '1', title: 'Respect & Professionalism', points: [\n    'Always maintain a professional and respectful tone in discussions.',\n    'Avoid offensive, discriminatory or inappropriate language, comments or media.',\n    \"Respect others' opinions, even when you disagree.\"\n  ]},\n  { num: '2', title: 'Stay on Topic', points: [\n    'This group is for sharing relevant information related to the wellness and health sector, workspace updates and professional collaboration.',\n    'Avoid sharing off-topic content like personal opinions, unrelated promotions or unrelated memes.'\n  ]},\n  { num: '3', title: 'No Self-Promotion or Spam', points: [\n    'Do not use this platform to directly advertise or promote your business, services or products unless specifically allowed for community-wide benefit (for example, offers or workshops relevant to the group).',\n    'Avoid unsolicited private messages to members for promotional purposes.'\n  ]},\n  { num: '3a', title: 'Phone Number Visibility & Unsolicited Contact', points: [\n    'Within each sub-group (Train, Treat, Dental, and others), your phone number is visible to other members of that sub-group. Within the main Announcement Group, your number may be visible to all community members.',\n    'You can reduce your visibility by enabling Phone Number Privacy in your group settings (Settings > Privacy > Phone number privacy). We recommend all members do this.',\n    \"Under no circumstances should you use another member's phone number obtained through this community to contact them without their explicit permission.\",\n    'Unsolicited direct messages of a commercial, promotional or personal nature to fellow members are a breach of these guidelines and your UNTIL membership agreement.',\n    \"Any member found to be using contact information from this community to solicit other members' clients, poach clients or act in a way that undermines fellow members' businesses will be removed from the community immediately and their membership will be reviewed.\"\n  ]},\n  { num: '4', title: 'Confidentiality', points: [\n    'Do not share any confidential or sensitive client or patient information. Always adhere to privacy regulations (such as GDPR) when discussing case studies or examples.',\n    \"What's shared in the group stays in the group. Respect the confidentiality of discussions.\"\n  ]},\n  { num: '5', title: 'Constructive Contributions', points: [\n    'Share valuable resources, insights or opportunities that can benefit the group, such as workshops, articles or industry news.',\n    'When asking for advice or opinions, keep it concise and relevant to the wellness or shared workspace environment.'\n  ]},\n  { num: '6', title: 'Be Mindful of Messaging Volume', points: [\n    'Avoid flooding the group with too many messages, especially outside of working hours. Use the platform responsibly to keep conversations streamlined and purposeful.'\n  ]},\n  { num: '7', title: 'Announcements & Admins', points: [\n    'Important company announcements will be shared by group admins. Please refrain from cluttering or interrupting these messages.',\n    'If you have any suggestions or concerns, feel free to message the admin directly.'\n  ]},\n  { num: '8', title: 'Event & Collaboration Notices', points: [\n    'Feel free to share information about community events or collaborations that may benefit other members.',\n    'All collaborative opportunities should align with the wellness and health focus of the group.'\n  ]},\n  { num: '9', title: 'Respectful Disputes', points: [\n    'If conflicts arise, handle them respectfully and consider taking the conversation outside of the group or consulting an admin to mediate.'\n  ]},\n  { num: '10', title: 'No Forwarded Messages or Misinformation', points: [\n    'Avoid sharing forwarded messages, especially without verifying their authenticity. Misinformation can be harmful, so ensure that all shared content is accurate and trustworthy.'\n  ]},\n  { num: '11', title: 'Use of Group for Queries', points: [\n    'Feel free to ask relevant questions or request advice, but ensure they are professional and wellness-related. If the conversation becomes personal or too detailed, take it to private messaging.'\n  ]},\n  { num: '12', title: 'Respect Group Purpose', points: [\n    'This is a community built for mutual support, sharing insights and creating a collaborative environment. Keep the focus on professional development, networking and creating value for all members.'\n  ]}\n];\n\nclass Component extends DCLogic {\n  renderVals() {\n    return { sections: SECTIONS };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
